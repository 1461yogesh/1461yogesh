    <text x="361.5" y="20" text-anchor="middle" fill="#FFE0A0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1">LEARN</text>
  </g>
  <text x="1210" y="318" text-anchor="end" fill="#8BA6B6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="2">1461YOGESH</text>
